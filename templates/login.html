<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DeTecWorm</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #121614;
            color: #e0e6e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            flex-direction: column;
        }

        .alert-box {
            display: none;
            background-color: #2d1a1a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 400px;
            width: 100%;
            font-size: 0.9rem;
            text-align: center;
        }

        .login-card {
            background-color: #1a221f;
            border: 1px solid #28352e;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: #1b382b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: #22c55e;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        h1 span {
            color: #22c55e;
        }

        p.subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .google-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="alertBox" class="alert-box"></div>

    <div class="login-card">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24">
                <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22l1-2.3C9,17.5 11.5,15 16,14.5A8,8 0 0,0 22,7.5C22,7.5 17,8 17,8M17,3C12,3 7.5,6.5 6,11C9,8.5 13,8 17,3Z"/>
            </svg>
        </div>

        <h1>DeTec<span>Worm</span></h1>
        <p class="subtitle">Accede para vincular tu historial de análisis e inspección de lombrices.</p>

        <div class="google-btn-container">
            <div id="g_id_onload"
                data-client_id="857174676804-8qj3u5ph6ut9drjar4rq2dis0mf6ctiq.apps.googleusercontent.com"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                data-type="standard"
                data-shape="pill"
                data-theme="dark"
                data-text="signin_with"
                data-size="large"
                data-logo_alignment="left">
            </div>
        </div>
    </div>

    <script>
        function showError(msg) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
        }

        async function handleCredentialResponse(response) {
            try {
                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    // AQUÍ ESTÁ LA CLAVE: Redirige al Panel Principal inmediatamente
                    window.location.href = '/';
                } else {
                    showError(data.detail || 'Error al iniciar sesión');
                }
            } catch (err) {
                showError('Error de conexión con el servidor');
            }
        }
    </script>
</body>
</html>

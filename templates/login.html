<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DeTecWorm Pocket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- SDK oficial de Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans relative overflow-hidden">

    <!-- Efecto de resplandor ambiental al fondo -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] sm:w-[450px] h-[300px] sm:h-[450px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <main class="w-full max-w-sm relative z-10 space-y-6">

        <!-- Card Principal de Login -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-7 sm:p-8 shadow-2xl backdrop-blur-xl text-center space-y-6">
            
            <!-- Branding / Logo -->
            <div class="space-y-2">
                <div class="w-14 h-14 bg-emerald-950/60 border border-emerald-800/50 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-950/50">
                    <i class="fa-solid fa-leaf text-2xl"></i>
                </div>
                
                <h1 class="text-2xl font-bold text-slate-100 tracking-tight flex items-center justify-center gap-2 pt-2">
                    DeTecWorm 
                    <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-semibold">Pocket</span>
                </h1>
                
                <p class="text-xs text-slate-400 leading-relaxed px-2">
                    Accede para vincular tu historial de análisis, inspección y seguimiento de cultivos.
                </p>
            </div>

            <!-- Botón / Contenedor oficial de Google Auth -->
            <div class="pt-2 flex justify-center items-center">
                <!-- Google SDK renderizará el botón oficial aquí -->
                <div id="g_id_onload"
                     data-client_id="857174676804-8qj3u5ph6ut9drjar4rq2dis0mf6ctiq.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin w-full"
                     data-type="standard"
                     data-size="large"
                     data-theme="outline"
                     data-text="sign_in_with"
                     data-shape="rectangular"
                     data-logo_alignment="left"
                     data-width="320">
                </div>
            </div>

            <!-- Footer pequeño dentro de la card -->
            <div class="border-t border-slate-800/80 pt-4 text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-emerald-500/80"></i>
                <span>Autenticación segura</span>
            </div>

        </div>

        <!-- Footer fuera de la card -->
        <p class="text-center text-[11px] text-slate-600">
            © DeTecWorm Pocket — Todos los derechos reservados
        </p>

    </main>

    <!-- Script de procesamiento del token devuelto por Google -->
    <script>
        async function handleCredentialResponse(response) {
            try {
                // response.credential contiene el JWT firmado por Google
                const res = await fetch('/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token: response.credential })
                });

                if (res.ok) {
                    // Si la sesión fue iniciada con éxito, redirige a la página principal (/)
                    window.location.href = '/';
                } else {
                    const errorData = await res.json();
                    alert('Error de inicio de sesión: ' + (errorData.detail || 'Token no válido'));
                }
            } catch (error) {
                console.error('Error al comunicarse con el servidor:', error);
            }
        }
    </script>

</body>
</html>
